name: Security Scan

# GHAS-free: Trivy prints findings to the Actions log (no SARIF / Security tab).
# Skip for a commit: include "[skip scan]" in the commit message.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (fs + secrets)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message || '', '[skip scan]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
